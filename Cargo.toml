[package]
name = "indexmap_store"
version = "0.2.2"
edition = "2024"
description = "Persistent IndexMap for Rust — embedded key-value store with in-memory hash map + append-only WAL on disk. O(1) get/insert/remove, insertion-order iteration, crash-safe recovery, automatic log compaction, serde-generic keys and values. No dependencies on sled/sqlite."
license = "MIT"
readme = "README.md"
repository = "https://github.com/shirotech/indexmap_store"
homepage = "https://github.com/shirotech/indexmap_store"
documentation = "https://docs.rs/indexmap_store"
keywords = ["indexmap", "key-value", "persistent", "database", "embedded"]
categories = ["data-structures", "database-implementations", "filesystem"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
ahash = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
libc = "0.2"
tikv-jemallocator = "0.6"

# Exclude the lib and integration tests from `cargo bench` so plain
# `cargo bench -- --verify 3` reaches only the custom `store_bench` harness.
# Without this, libtest gets the args first and errors on "Unrecognized
# option: 'verify'".
[lib]
bench = false

[[test]]
name = "integration"
bench = false

[[bench]]
name = "store_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
