[package]
name = "indexmap_store"
version = "0.1.0"
edition = "2024"
description = "Mutable, persistent key-value store backed by an IndexMap with an append-only log."
license = "MIT OR Apache-2.0"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bench]]
name = "store_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
