[package]
name = "indexmap_store"
version = "0.2.0"
edition = "2024"
description = "Mutable, persistent key-value store backed by an IndexMap with an append-only log."
license = "MIT OR Apache-2.0"
exclude = [
    "OPTIMIZATIONS.md",
    "optimization-diffs/",
    "bench_results.json",
    ".claude/",
]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
ahash = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bench]]
name = "store_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
